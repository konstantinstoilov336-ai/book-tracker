<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Book Tracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Book Tracker</title>
<!-- The public page of the web version. It holds nothing personal: once the access key is in,
     it loads the app itself (app/index.html) from the private data repository and runs it. -->
<style>
  :root { --bg: #f6f5f1; --surface: #fff; --ink: #1d1d1b; --ink-3: #77756e; --line: #e3e1da; --accent: #1f6f5c; --red: #b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161615; --surface: #201f1d; --ink: #eceae4; --ink-3: #9b988f; --line: #34332f; --accent: #4fb59a; --red: #f08a80; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; }
  .card { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p { color: var(--ink-3); margin: 0 0 18px; font-size: 14px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
  input { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); font: inherit; }
  button { margin-top: 20px; width: 100%; padding: 12px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font: inherit; font-weight: 650; cursor: pointer; }
  button:disabled { opacity: .6; }
  .err { color: var(--red); font-size: 13.5px; margin-top: 12px; min-height: 1em; }
  .spin { text-align: center; color: var(--ink-3); }
</style>
</head>
<body>
<div class="card" id="card"><div class="spin">Opening Book Tracker…</div></div>
<script>
const KEY = "bt.github";
const owner = location.hostname.split(".")[0];  // <user>.github.io
const cfg = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch { return null; } })();
const repoParam = (new URLSearchParams(location.search).get("repo") || "").replace(/[^\w.-]/g, "");
// The shipping helper (their own repository) gets the page in Bulgarian.
const BG = /shipping/i.test(repoParam || (cfg && cfg.repo) || "");
const T = BG ? {
  opening: "Отваряне…", intro: "Въведи ключа си за достъп до GitHub веднъж на това устройство. Пази се само в този браузър.",
  user: "Потребителско име в GitHub", repo: "Хранилище", key: "Ключ за достъп", open: "Отвори", checking: "Проверка…",
  offline: "Няма връзка с GitHub — провери интернета и натисни „Отвори“.",
  badKey: "GitHub не прие този ключ — може да е изтекъл или сменен. Постави актуалния.",
  noApp: (o, r) => `Приложението не е намерено в ${o}/${r}. Провери дали ключът има достъп до това хранилище.`,
  answered: s => `GitHub отговори с ${s}.`,
} : {
  opening: "Opening Book Tracker…", intro: "Enter your GitHub access key once on this device. It's kept only in this browser.",
  user: "GitHub user name", repo: "Data repository", key: "Access key", open: "Open Book Tracker", checking: "Checking…",
  offline: "Couldn't reach GitHub — check the internet connection, then tap Open Book Tracker.",
  badKey: "GitHub didn't accept that access key — it may have expired or been replaced. Paste the current one.",
  noApp: (o, r) => `Couldn't find the app in ${o}/${r}. Check the access key includes that repository, and that Book Tracker on your PC is connected to GitHub.`,
  answered: s => `GitHub answered ${s}.`,
};
if (BG) { document.documentElement.lang = "bg"; document.querySelector(".spin").textContent = T.opening; }

async function fetchApp(c) {
  let r;
  try {
    r = await fetch(`${c.api || "https://api.github.com"}/repos/${c.owner}/${c.repo}/contents/app/index.html`, {
      cache: "no-store", headers: { Authorization: `Bearer ${c.token}`, Accept: "application/vnd.github.raw+json" } });
  } catch { throw new Error(T.offline); }
  if (r.status === 401) throw new Error(T.badKey);
  if (r.status === 404) throw new Error(T.noApp(c.owner, c.repo));
  if (!r.ok) throw new Error(T.answered(r.status));
  return r.text();
}
function run(html, c) {
  // The app's own <head> replaces this page's, so the home-screen icon and manifest go in again.
  const boot = `<script>window.BT_WEB = ${JSON.stringify(c).replace(/</g, "\\u003c")};<\/script>` +
    `<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.png">` +
    `<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">` +
    `<meta name="apple-mobile-web-app-title" content="Book Tracker"><meta name="theme-color" content="#1f6f5c">`;
  document.open();
  document.write(html.replace(/<head>/i, "<head>" + boot));
  document.close();
}
function form(msg) {
  const card = document.getElementById("card");
  card.innerHTML = `<h1>Book Tracker</h1><p>${T.intro}</p>
    <label for="o">${T.user}</label><input id="o" autocomplete="username" value="${owner}">
    <label for="r">${T.repo}</label><input id="r" value="${repoParam || "book-tracker-data"}">
    <label for="t">${T.key}</label><input id="t" type="password" autocomplete="current-password" placeholder="github_pat_…">
    <button id="go">${T.open}</button><div class="err" id="err"></div>`;
  document.getElementById("err").textContent = msg || "";
  document.getElementById("go").onclick = async () => {
    const c = { owner: document.getElementById("o").value.trim(), repo: document.getElementById("r").value.trim(),
                token: document.getElementById("t").value.trim() };
    const b = document.getElementById("go"); b.disabled = true; b.textContent = T.checking;
    try { const html = await fetchApp(c); localStorage.setItem(KEY, JSON.stringify(c)); run(html, c); }
    catch (e) { document.getElementById("err").textContent = e.message; b.disabled = false; b.textContent = T.open; }
  };
}
if (cfg) fetchApp(cfg).then(html => run(html, cfg), e => form(e.message));
else form();
</script>
</body>
</html>
